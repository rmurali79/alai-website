#cloud-config
# First-start setup for the alai-labs.com server (Ubuntu 24.04 on Hetzner Cloud).
# Generated by scripts/cloud-init.mjs from deploy/Caddyfile; do not edit by hand.
# Paste this into "Cloud config" when creating the server, after replacing
# PASTE_DEPLOY_PUBLIC_KEY_HERE with the deploy key's public line
# (see docs/operations/hetzner.md).

package_update: true
package_upgrade: true
packages:
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
  - rsync
  - ufw
  - fail2ban
  - unattended-upgrades

users:
  - default
  - name: deploy
    gecos: Website deploys from GitHub
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - PASTE_DEPLOY_PUBLIC_KEY_HERE

write_files:
  - path: /etc/ssh/sshd_config.d/10-alai.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  - path: /etc/systemd/system/caddy.service.d/site.conf
    content: |
      [Service]
      # The address the site answers on. Change to alai-labs.com when the
      # domain moves, then: systemctl daemon-reload && systemctl restart caddy
      Environment=SITE_DOMAIN=staging.alai-labs.com
  - path: /var/www/alai/releases/initial/index.html
    content: |
      <!doctype html><html lang="en"><title>Alai Labs</title><p>The site is being set up.</p></html>
  - path: /root/Caddyfile.alai
    content: |
      # Web server for alai-labs.com on the Hetzner server (Caddy 2).
      # Caddy gets and renews the HTTPS certificate on its own.
      # SITE_DOMAIN is set in /etc/systemd/system/caddy.service.d/site.conf:
      # staging.alai-labs.com while testing, alai-labs.com once the domain moves.
      # After changing this file, copy it to /etc/caddy/Caddyfile on the server and
      # run: systemctl reload caddy (see docs/operations/hetzner.md).

      (headers) {
      	header {
      		Strict-Transport-Security "max-age=31536000"
      		X-Content-Type-Options "nosniff"
      		Referrer-Policy "strict-origin-when-cross-origin"
      		Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      		Cross-Origin-Opener-Policy "same-origin"
      		-Server
      	}
      	# Public pages: only the site's own files. The hash is the one-line inline
      	# script in src/layout.html that adds the "js" class. When a form service
      	# is chosen, add its address to connect-src.
      	@public not path /admin/*
      	header @public Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      	# The admin talks to GitHub and loads its own fonts, so it gets a looser
      	# policy, is never cached and is kept out of search.
      	@admin path /admin/*
      	header @admin {
      		Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      		Cache-Control "no-cache"
      		X-Robots-Tag "noindex, nofollow"
      	}
      }

      (site) {
      	root * /var/www/alai/current
      	encode zstd gzip
      	import headers

      	# File names do not change between versions, so pages, CSS and scripts are
      	# checked for changes on every visit (cheap: an unchanged file is not resent).
      	# Fonts never change; images keep for a day.
      	@revalidate not path /assets/fonts/* /assets/img/* /admin/*
      	header @revalidate Cache-Control "no-cache"
      	@fonts path /assets/fonts/*
      	header @fonts Cache-Control "public, max-age=31536000, immutable"
      	@images path /assets/img/*
      	header @images Cache-Control "public, max-age=86400"

      	file_server

      	# Unknown addresses get the site's own 404 page (the headers above still apply).
      	handle_errors 404 {
      		rewrite * /404.html
      		file_server
      	}
      }

      {$SITE_DOMAIN:alai-labs.com} {
      	import site
      }

      www.{$SITE_DOMAIN:alai-labs.com} {
      	redir https://{$SITE_DOMAIN:alai-labs.com}{uri} permanent
      }

runcmd:
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - ln -sfn releases/initial /var/www/alai/current
  - chown -R deploy:deploy /var/www/alai
  - install -m 644 /root/Caddyfile.alai /etc/caddy/Caddyfile
  - caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  - systemctl daemon-reload
  - systemctl restart caddy
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl restart ssh
